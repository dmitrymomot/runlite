name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build:
    name: Build and Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Get version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Build binaries
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          # Build runlite for linux/amd64
          GOOS=linux GOARCH=amd64 go build \
            -ldflags "-X main.version=${VERSION}" \
            -o runlite-linux-amd64 \
            ./cmd/runlite

          # Build runlite for linux/arm64
          GOOS=linux GOARCH=arm64 go build \
            -ldflags "-X main.version=${VERSION}" \
            -o runlite-linux-arm64 \
            ./cmd/runlite

          # Build domain-registry for linux/amd64
          GOOS=linux GOARCH=amd64 go build \
            -ldflags "-X main.version=${VERSION}" \
            -o runlite-domain-registry-linux-amd64 \
            ./cmd/domain-registry

          # Build domain-registry for linux/arm64
          GOOS=linux GOARCH=arm64 go build \
            -ldflags "-X main.version=${VERSION}" \
            -o runlite-domain-registry-linux-arm64 \
            ./cmd/domain-registry

      - name: Create archives
        run: |
          # Create tar.gz for runlite linux/amd64
          tar -czf runlite_linux_amd64.tar.gz runlite-linux-amd64
          mv runlite-linux-amd64 runlite
          tar -czf runlite_linux_amd64_with_name.tar.gz runlite
          mv runlite runlite-linux-amd64

          # Create tar.gz for runlite linux/arm64
          tar -czf runlite_linux_arm64.tar.gz runlite-linux-arm64
          mv runlite-linux-arm64 runlite
          tar -czf runlite_linux_arm64_with_name.tar.gz runlite
          mv runlite runlite-linux-arm64

          # Use the version with "runlite" name for final archives
          mv runlite_linux_amd64_with_name.tar.gz runlite_linux_amd64.tar.gz
          mv runlite_linux_arm64_with_name.tar.gz runlite_linux_arm64.tar.gz

          # Create tar.gz for domain-registry linux/amd64
          tar -czf runlite-domain-registry_linux_amd64.tar.gz runlite-domain-registry-linux-amd64
          mv runlite-domain-registry-linux-amd64 runlite-domain-registry
          tar -czf runlite-domain-registry_linux_amd64_with_name.tar.gz runlite-domain-registry
          mv runlite-domain-registry runlite-domain-registry-linux-amd64

          # Create tar.gz for domain-registry linux/arm64
          tar -czf runlite-domain-registry_linux_arm64.tar.gz runlite-domain-registry-linux-arm64
          mv runlite-domain-registry-linux-arm64 runlite-domain-registry
          tar -czf runlite-domain-registry_linux_arm64_with_name.tar.gz runlite-domain-registry
          mv runlite-domain-registry runlite-domain-registry-linux-arm64

          # Use the version with "runlite-domain-registry" name for final archives
          mv runlite-domain-registry_linux_amd64_with_name.tar.gz runlite-domain-registry_linux_amd64.tar.gz
          mv runlite-domain-registry_linux_arm64_with_name.tar.gz runlite-domain-registry_linux_arm64.tar.gz

      - name: Generate checksums
        run: |
          sha256sum runlite_linux_amd64.tar.gz > checksums.txt
          sha256sum runlite_linux_arm64.tar.gz >> checksums.txt
          sha256sum runlite-domain-registry_linux_amd64.tar.gz >> checksums.txt
          sha256sum runlite-domain-registry_linux_arm64.tar.gz >> checksums.txt

      - name: Update install.sh version
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          # Update VERSION variable in install.sh
          sed -i "s/VERSION=\"\${RUNLITE_VERSION:-latest}\"/VERSION=\"\${RUNLITE_VERSION:-${VERSION}}\"/" scripts/install.sh

          # Verify the change
          grep "VERSION=" scripts/install.sh

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            runlite_linux_amd64.tar.gz
            runlite_linux_arm64.tar.gz
            runlite-domain-registry_linux_amd64.tar.gz
            runlite-domain-registry_linux_arm64.tar.gz
            checksums.txt
            scripts/install.sh
          body: |
            ## Installation

            ### Quick Install

            ```bash
            curl -1sLf 'https://raw.githubusercontent.com/${{ github.repository }}/${{ steps.version.outputs.VERSION }}/scripts/install.sh' | sudo -E bash
            ```

            ### Manual Installation

            Download the appropriate binary for your platform:

            **Runlite CLI:**
            - **Linux AMD64**: `runlite_linux_amd64.tar.gz`
            - **Linux ARM64**: `runlite_linux_arm64.tar.gz`

            **Domain Registry:**
            - **Linux AMD64**: `runlite-domain-registry_linux_amd64.tar.gz`
            - **Linux ARM64**: `runlite-domain-registry_linux_arm64.tar.gz`

            Extract and install:

            ```bash
            # Install runlite
            tar -xzf runlite_linux_amd64.tar.gz
            sudo install -m 755 runlite /usr/local/bin/runlite

            # Install domain-registry
            tar -xzf runlite-domain-registry_linux_amd64.tar.gz
            sudo install -m 755 runlite-domain-registry /usr/local/bin/runlite-domain-registry
            ```

            ### Verify Installation

            ```bash
            runlite --version
            # Should output: runlite v${{ steps.version.outputs.VERSION }}

            runlite-domain-registry --version
            # Should output: runlite-domain-registry v${{ steps.version.outputs.VERSION }}
            ```

            ## Checksums

            See `checksums.txt` for SHA256 checksums of the binaries.
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
